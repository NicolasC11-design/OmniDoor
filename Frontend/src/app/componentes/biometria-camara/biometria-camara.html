<div class="biometria-container">
    
    <div class="status-badge" [ngClass]="{'success': modelosCargados, 'error': !modelosCargados && !cargandoModelos}">
        {{ cargandoModelos ? 'CARGANDO RED NEURONAL BIOMÉTRICA...' : (modelosCargados ? 'SISTEMA BIOMÉTRICO LISTO' : 'ERROR DE CARGA DE MODELOS') }}
    </div>

    <div class="video-wrapper">
        <video #videoElement class="video-stream" autoplay playsinline muted [hidden]="!camaraActiva"></video>
        
        <canvas #canvasElement style="display: none;"></canvas>

        <div *ngIf="cargandoModelos" class="loading-overlay">
            <div class="spinner"></div>
            <span class="status-badge">CARGANDO MODELOS FACE-API...</span>
        </div>

        <div *ngIf="procesandoCaptura" class="loading-overlay">
            <div class="spinner"></div>
            <span class="status-badge">PROCESANDO VECTOR BIOMÉTRICO...</span>
        </div>

        <div *ngIf="camaraActiva && modelosCargados && !procesandoCaptura" class="scan-line"></div>
    </div>

    <div class="controls">
        <!-- Selector desplegable de dispositivos de cámara -->
        <select 
          *ngIf="camaraActiva && dispositivosVideo.length > 1" 
          class="select-camara"
          [value]="dispositivoSeleccionadoId"
          (change)="alCambiarCamara($event)"
          [disabled]="procesandoCaptura">
          <option *ngFor="let dispositivo of dispositivosVideo; let i = index" [value]="dispositivo.deviceId">
            {{ dispositivo.label || 'Cámara ' + (i + 1) }}
          </option>
        </select>

        <!-- Botón para Encender Cámara -->
        <button *ngIf="!camaraActiva" type="button" class="btn-cyber" [disabled]="cargandoModelos" (click)="iniciarCamara()">
            📷 ENCENDER CÁMARA
        </button>

        <!-- Botón para Capturar Biometría -->
        <button *ngIf="camaraActiva" type="button" class="btn-cyber" [disabled]="!modelosCargados || procesandoCaptura" (click)="capturarRostro()">
            ⚡ CAPTURAR BIOMETRÍA
        </button>
    </div>
</div>

<div class="camera-container">
    <!-- Video en vivo de la cámara -->
    <video #videoElement autoplay playsinline [hidden]="!camaraActiva" class="video-preview"></video>

    <!-- Canvas oculto para procesar el fotograma -->
    <canvas #canvasElement style="display: none;"></canvas>

    <div class="controls mt-3">
        <button *ngIf="!camaraActiva" type="button" class="btn btn-primary" (click)="iniciarCamara()">
            📷 Encender Cámara
        </button>

        <button *ngIf="camaraActiva" type="button" class="btn btn-success" (click)="capturarRostro()">
            ⚡ Capturar Rostro
        </button>
    </div>
</div>
